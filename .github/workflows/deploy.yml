name: NetSuite SDF CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SUITECLOUD_CI: '1'
  SUITECLOUD_CI_PASSKEY: '0123456789abcdef0123456789abcdef'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm ci --acceptsuitecloudsdklicense || npm install --acceptsuitecloudsdklicense

      - name: Save NetSuite Authentication Token
        env:
          NS_ACCOUNT: ${{ secrets.NS_ACCOUNT }}
          NS_AUTH_ID: ${{ secrets.NS_AUTH_ID }}
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
          NS_CONSUMER_KEY: ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
        run: |
          export AUTH_ID="${NS_AUTH_ID:-default}"
          node -e "const p = require('./project.json'); p.defaultAuthId = process.env.AUTH_ID; require('fs').writeFileSync('./project.json', JSON.stringify(p, null, 2));"
          npx suitecloud account:savetoken \
            --account "${NS_ACCOUNT}" \
            --authid "${AUTH_ID}" \
            --tokenid "${NS_TOKEN_ID}" \
            --tokensecret "${NS_TOKEN_SECRET}" \
            --consumerkey "${NS_CONSUMER_KEY}" \
            --consumersecret "${NS_CONSUMER_SECRET}"

      - name: Validate SDF Project
        if: github.event_name == 'pull_request'
        run: npx suitecloud project:validate

      - name: Deploy SDF Project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx suitecloud project:deploy
