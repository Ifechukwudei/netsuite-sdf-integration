name: NetSuite SDF CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SUITECLOUD_CI: 'true'
  SUITECLOUD_CI_PASSKEY: ${{ secrets.SUITECLOUD_CI_PASSKEY || '0123456789abcdef0123456789abcdef' }}
  NS_AUTH_ID: ${{ secrets.NS_AUTH_ID || 'DemoDeployer' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm ci --acceptsuitecloudsdklicense || npm install --acceptsuitecloudsdklicense

      - name: Save NetSuite Authentication Token
        env:
          NS_ACCOUNT: ${{ secrets.NS_ACCOUNT }}
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
          NS_CONSUMER_KEY: ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
        run: |
          echo "Saving token for account: ${NS_ACCOUNT} with Auth ID: ${NS_AUTH_ID}..."
          npx suitecloud account:savetoken \
            --account "${NS_ACCOUNT}" \
            --authid "${NS_AUTH_ID}" \
            --tokenid "${NS_TOKEN_ID}" \
            --tokensecret "${NS_TOKEN_SECRET}" \
            --consumerkey "${NS_CONSUMER_KEY}" \
            --consumersecret "${NS_CONSUMER_SECRET}"

      - name: Bind Auth ID to project.json
        run: |
          node -e '
            const fs = require("fs");
            const file = "./project.json";
            const targetAuthId = process.env.NS_AUTH_ID;
            
            if (fs.existsSync(file)) {
              const p = JSON.parse(fs.readFileSync(file, "utf8"));
              p.defaultAuthId = targetAuthId;
              fs.writeFileSync(file, JSON.stringify(p, null, 2));
              console.log("Successfully set project.json defaultAuthId to:", targetAuthId);
            } else {
              console.error("project.json not found in workspace root!");
              process.exit(1);
            }
          '

      - name: Validate SDF Project
        if: github.event_name == 'pull_request'
        run: npx suitecloud project:validate

      - name: Deploy SDF Project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx suitecloud project:deploy
