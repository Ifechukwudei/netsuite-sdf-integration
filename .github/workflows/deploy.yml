name: NetSuite SDF Headless Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli --acceptsuitecloudsdklicense

      - name: Authenticate with NetSuite (TBA)
        run: |
          suitecloud account:savetoken \
            --authid "github_ci_runner" \
            --account "${{ secrets.NS_ACCOUNT }}" \
            --tokenid "${{ secrets.NS_TOKEN_ID }}" \
            --tokensecret "${{ secrets.NS_TOKEN_SECRET }}" \
            --consumerkey "${{ secrets.NS_CONSUMER_KEY }}" \
            --consumersecret "${{ secrets.NS_CONSUMER_SECRET }}"

      - name: Deploy Project
        run: |
          suitecloud project:deploy --account "${{ secrets.NS_ACCOUNT }}"
