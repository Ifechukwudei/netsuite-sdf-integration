name: NetSuite SDF CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SUITECLOUD_CI: 'true'
  SUITECLOUD_CI_PASSKEY: ${{ secrets.SUITECLOUD_CI_PASSKEY || '0123456789abcdef0123456789abcdef' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm ci --acceptsuitecloudsdklicense || npm install --acceptsuitecloudsdklicense

      - name: Prepare Demo Environment Secrets
        run: |
          if [ -z "${{ secrets.NS_ACCOUNT }}" ] || [ -z "${{ secrets.NS_TOKEN_ID }}" ] || [ -z "${{ secrets.NS_TOKEN_SECRET }}" ] || [ -z "${{ secrets.NS_CONSUMER_KEY }}" ] || [ -z "${{ secrets.NS_CONSUMER_SECRET }}" ]; then
            echo "::error::One or more NetSuite secrets are missing in GitHub repository settings."
            exit 1
          fi

          # Resolve Auth ID
          RAW_ID="${{ secrets.NS_AUTH_ID }}"
          CLEAN_ID=$(echo "${RAW_ID}" | tr -cd 'a-zA-Z0-9_-')
          if [ -z "${CLEAN_ID}" ]; then
            CLEAN_ID="DemoDeployer"
          fi
          echo "NS_AUTH_ID=${CLEAN_ID}" >> $GITHUB_ENV

          # Preserve Demo Account ID Formatting (Uppercase and converts hyphens to underscores e.g., 123456-td1 -> 123456_TD1)
          DEMO_ACCOUNT=$(echo "${{ secrets.NS_ACCOUNT }}" | tr '-' '_' | tr 'a-z' 'A-Z')
          echo "NS_ACCOUNT=${DEMO_ACCOUNT}" >> $GITHUB_ENV

      - name: Save NetSuite Authentication Token
        env:
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
          NS_CONSUMER_KEY: ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
        run: |
          echo "Authenticating against Demo Account: ${NS_ACCOUNT}..."
          npx suitecloud account:savetoken \
            --account "${NS_ACCOUNT}" \
            --authid "${NS_AUTH_ID}" \
            --tokenid "${NS_TOKEN_ID}" \
            --tokensecret "${NS_TOKEN_SECRET}" \
            --consumerkey "${NS_CONSUMER_KEY}" \
            --consumersecret "${NS_CONSUMER_SECRET}"

      - name: Bind Auth ID to project.json
        run: |
          node -e '
            const fs = require("fs");
            const file = "./project.json";
            if (fs.existsSync(file)) {
              const p = JSON.parse(fs.readFileSync(file, "utf8"));
              p.defaultAuthId = process.env.NS_AUTH_ID;
              fs.writeFileSync(file, JSON.stringify(p, null, 2));
              console.log("Successfully set defaultAuthId to:", process.env.NS_AUTH_ID);
            } else {
              console.error("project.json missing in root directory!");
              process.exit(1);
            }
          '

      - name: Validate SDF Project
        if: github.event_name == 'pull_request'
        run: npx suitecloud project:validate

      - name: Deploy SDF Project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx suitecloud project:deploy
