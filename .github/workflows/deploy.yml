name: NetSuite SDF CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SUITECLOUD_CI: 'true'
  SUITECLOUD_CI_PASSKEY: ${{ secrets.SUITECLOUD_CI_PASSKEY || '0123456789abcdef0123456789abcdef' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Dependencies
        run: npm ci --acceptsuitecloudsdklicense || npm install --acceptsuitecloudsdklicense

      - name: Save NetSuite Authentication Token
        env:
          NS_ACCOUNT: ${{ secrets.NS_ACCOUNT }}
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
          NS_CONSUMER_KEY: ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
        run: |
          # Determine auth id (fallback to DemoDeployer if secret is missing)
          NS_AUTH_ID="${{ secrets.NS_AUTH_ID }}"
          if [ -z "$NS_AUTH_ID" ]; then
            NS_AUTH_ID="DemoDeployer"
          fi
          echo "Using NS_AUTH_ID=$NS_AUTH_ID"

          # Save token (fail on error)
          set -o pipefail
          npx suitecloud account:savetoken \
            --account "${NS_ACCOUNT}" \
            --authid "${NS_AUTH_ID}" \
            --tokenid "${NS_TOKEN_ID}" \
            --tokensecret "${NS_TOKEN_SECRET}" \
            --consumerkey "${NS_CONSUMER_KEY}" \
            --consumersecret "${NS_CONSUMER_SECRET}"
          
          echo "savetoken returned: $?"

          # Verify the saved auth exists (list saved accounts)
          echo "Saved accounts:"
          npx suitecloud account:list || true

      - name: Bind Auth ID to project.json
        run: |
          NS_AUTH_ID="${{ secrets.NS_AUTH_ID }}"
          if [ -z "$NS_AUTH_ID" ]; then
            NS_AUTH_ID="DemoDeployer"
          fi
          echo "Binding defaultAuthId=${NS_AUTH_ID} in project.json"

          node -e '
            const fs = require("fs");
            const file = "./project.json";
            if (fs.existsSync(file)) {
              const p = JSON.parse(fs.readFileSync(file, "utf8"));
              // Read fallback from process.argv[1] to avoid masking/scoping issues in logs
              p.defaultAuthId = process.argv[1];
              fs.writeFileSync(file, JSON.stringify(p, null, 2));
              console.log("Successfully set defaultAuthId in project.json");
            } else {
              console.error("project.json not found in root!");
              process.exit(1);
            }
          ' "$NS_AUTH_ID"

      - name: Validate SDF Project
        if: github.event_name == 'pull_request'
        run: npx suitecloud project:validate

      - name: Deploy SDF Project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx suitecloud project:deploy
