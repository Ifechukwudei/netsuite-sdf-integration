name: NetSuite SDF CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SUITECLOUD_CI: 'true'
  SUITECLOUD_CI_PASSKEY: ${{ secrets.SUITECLOUD_CI_PASSKEY || '0123456789abcdef0123456789abcdef' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm ci --acceptsuitecloudsdklicense || npm install --acceptsuitecloudsdklicense

      - name: Authenticate via OAuth 2.0 (M2M)
        env:
          NS_ACCOUNT: ${{ secrets.NS_ACCOUNT }}
          NS_CERTIFICATE_ID: ${{ secrets.NS_CERTIFICATE_ID }}
        run: |
          set -e
          echo "Setting up OAuth 2.0 authentication for Account: ${NS_ACCOUNT}..."
          
          # Use a Heredoc to safely write the private key while strictly preserving newlines
          cat << 'EOF' > private_key.pem
          ${{ secrets.NS_PRIVATE_KEY }}
          EOF
          
          npx suitecloud account:setup:ci \
            --account "${NS_ACCOUNT}" \
            --authid "default" \
            --certificateid "${NS_CERTIFICATE_ID}" \
            --privatekeypath "./private_key.pem"
            
          rm private_key.pem

      - name: Validate SDF Project
        if: github.event_name == 'pull_request'
        run: npx suitecloud project:validate

      - name: Deploy SDF Project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx suitecloud project:deploy
