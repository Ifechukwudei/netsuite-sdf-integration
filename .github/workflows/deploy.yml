name: NetSuite SDF Headless Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli --acceptsuitecloudsdklicense

      - name: Restore Private Key
        run: |
          echo "${{ secrets.NS_PRIVATE_KEY_B64 }}" | base64 --decode > ./private.pem

      - name: Authenticate with NetSuite (OAuth 2.0 M2M)
        run: |
          suitecloud account:setup:ci \
            --authid "github_ci_runner" \
            --account "${{ secrets.NS_ACCOUNT }}" \
            --certificateid "${{ secrets.NS_CERTIFICATE_ID }}" \
            --privatekeypath ./private.pem

      - name: Deploy Project
        run: |
          suitecloud project:deploy
